lang: en
rules:
  - id: en_strip_invisible
    type: strip
    chars: ["​", "‌", "‍", "﻿"]
  - id: en_leetspeak
    type: map
    mapping: {"4": "a", "3": "e", "1": "i", "0": "o", "$": "s", "@": "a"}
  - id: en_collapse_repeats
    type: collapse_repeats
    max_run: 2
fixtures:
  - {input: "sc4m", expected: "scam"}
  - {input: "sc​am", expected: "scam"}
  - {input: "freeee", expected: "free"}
