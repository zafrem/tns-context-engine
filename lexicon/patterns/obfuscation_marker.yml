    term: "[\u200B\u200C\u200D\uFEFF\u2060\u00AD]{2,}"
    type: regex
    rank: 1
    ambiguity: 0.4
    always_run: true
    notes: "Multiple consecutive zero-width or invisible characters used to break tokenization."
  - id: patterns_obfuscation_marker_0002
